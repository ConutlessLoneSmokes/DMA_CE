[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dma-ce"
version = "0.1.0"
description = "Reliability-conditioned residual channel estimation with physical wideband DMAs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
